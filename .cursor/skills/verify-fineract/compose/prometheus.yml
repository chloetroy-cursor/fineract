global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Mounted from config/docker/prometheus/etc/rules by observability.yml.
rule_files:
  - "rules/*.rules.yml"

scrape_configs:
  - job_name: fineract-server
    metrics_path: /fineract-provider/actuator/prometheus
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["host.docker.internal:8443"]
