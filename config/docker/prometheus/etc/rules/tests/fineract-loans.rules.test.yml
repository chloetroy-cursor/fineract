# Unit tests for ../fineract-loans.rules.yml. Run from the repository root:
#
#   docker run --rm -v "$PWD/config/docker/prometheus/etc/rules:/rules:ro" --entrypoint promtool \
#     prom/prometheus:v2.47.2 test rules /rules/tests/fineract-loans.rules.test.yml
#
# This file is not matched by rule_files (rules/*.rules.yml does not descend into tests/).

rule_files:
  - ../fineract-loans.rules.yml

evaluation_interval: 1m

tests:
  # Loan command error and rejection ratios. One sample a minute.
  #   repay:    2% server_error                 -> warning only
  #   approve:  10% server_error, 10 a minute   -> warning and critical
  #   disburse: one server_error on a quiet system (1 command a minute) -> warning only, never critical
  #   submit:   30% client_error, 100 a minute  -> rejection warning
  - interval: 1m
    input_series:
      - series: 'fineract_loan_commands_total{application="fineract",command="repay",outcome="success"}'
        values: '0+98x30'
      - series: 'fineract_loan_commands_total{application="fineract",command="repay",outcome="server_error"}'
        values: '0+2x30'
      - series: 'fineract_loan_commands_total{application="fineract",command="approve",outcome="success"}'
        values: '0+90x30'
      - series: 'fineract_loan_commands_total{application="fineract",command="approve",outcome="server_error"}'
        values: '0+10x30'
      - series: 'fineract_loan_commands_total{application="fineract",command="disburse",outcome="success"}'
        values: '0+1x30'
      - series: 'fineract_loan_commands_total{application="fineract",command="disburse",outcome="server_error"}'
        values: '0x9 1x21'
      - series: 'fineract_loan_commands_total{application="fineract",command="submit",outcome="success"}'
        values: '0+70x30'
      - series: 'fineract_loan_commands_total{application="fineract",command="submit",outcome="client_error"}'
        values: '0+30x30'
      # rejected, but too few commands to judge: 1 a minute, half of them client_error
      - series: 'fineract_loan_commands_total{application="quiet",command="submit",outcome="success"}'
        values: '0+1x30'
      - series: 'fineract_loan_commands_total{application="quiet",command="submit",outcome="client_error"}'
        values: '0x20 1+1x10'
    alert_rule_test:
      # the hold time has not passed yet
      - eval_time: 4m
        alertname: FineractLoanCommandErrorRatioHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: FineractLoanCommandErrorRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              command: repay
            exp_annotations:
              summary: "Loan repay commands are failing with server errors"
              description: >-
                2% of loan repay commands on fineract ended in outcome="server_error" over the last 10 minutes
                (threshold 1%). These are failures that ErrorHandler does not map to a 4xx status. Look for the
                exceptions in the server log and at the command audit rows in m_portfolio_command_source.
          - exp_labels:
              severity: warning
              application: fineract
              command: approve
            exp_annotations:
              summary: "Loan approve commands are failing with server errors"
              description: >-
                10% of loan approve commands on fineract ended in outcome="server_error" over the last 10
                minutes (threshold 1%). These are failures that ErrorHandler does not map to a 4xx status. Look
                for the exceptions in the server log and at the command audit rows in
                m_portfolio_command_source.
          - exp_labels:
              severity: warning
              application: fineract
              command: disburse
            exp_annotations:
              summary: "Loan disburse commands are failing with server errors"
              description: >-
                9.091% of loan disburse commands on fineract ended in outcome="server_error" over the last 10
                minutes (threshold 1%). These are failures that ErrorHandler does not map to a 4xx status. Look
                for the exceptions in the server log and at the command audit rows in
                m_portfolio_command_source.
      - eval_time: 16m
        alertname: FineractLoanCommandErrorRatioCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              application: fineract
              command: approve
            exp_annotations:
              summary: "More than 5% of loan approve commands fail with server errors"
              description: >-
                10% of loan approve commands on fineract ended in outcome="server_error" over the last 5 minutes
                (threshold 5%, at least 5 failures). Customers cannot approve loans reliably.
      # the single disburse failure has left the 10 minute window
      - eval_time: 26m
        alertname: FineractLoanCommandErrorRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              command: repay
            exp_annotations:
              summary: "Loan repay commands are failing with server errors"
              description: >-
                2% of loan repay commands on fineract ended in outcome="server_error" over the last 10 minutes
                (threshold 1%). These are failures that ErrorHandler does not map to a 4xx status. Look for the
                exceptions in the server log and at the command audit rows in m_portfolio_command_source.
          - exp_labels:
              severity: warning
              application: fineract
              command: approve
            exp_annotations:
              summary: "Loan approve commands are failing with server errors"
              description: >-
                10% of loan approve commands on fineract ended in outcome="server_error" over the last 10
                minutes (threshold 1%). These are failures that ErrorHandler does not map to a 4xx status. Look
                for the exceptions in the server log and at the command audit rows in
                m_portfolio_command_source.
      - eval_time: 14m
        alertname: FineractLoanCommandRejectionRatioHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: FineractLoanCommandRejectionRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              command: submit
            exp_annotations:
              summary: "A quarter of loan submit commands are rejected"
              description: >-
                30% of loan submit commands on fineract ended in outcome="client_error" over the last 15 minutes
                (threshold 25%, at least 20 commands). Either a caller sends invalid requests, or the database
                rejects writes: data integrity and lock failures are mapped to 4xx and counted here.

  # Loan command latency. 100 successful commands a minute for each command.
  #   repay:    10% slower than 1 s, none slower than 2.5 s -> p95 = 1.75 s  -> warning
  #   approve:  40% slower than 2.5 s                       -> p95 = 4.69 s  -> warning and critical
  #   disburse: all faster than 500 ms                      -> no alert
  #   submit:   slow for 5 minutes only                     -> no alert, the hold time is 10 minutes
  - interval: 1m
    input_series:
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="repay",outcome="success",le="0.5"}'
        values: '0+80x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="repay",outcome="success",le="1.0"}'
        values: '0+90x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="repay",outcome="success",le="2.5"}'
        values: '0+100x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="repay",outcome="success",le="+Inf"}'
        values: '0+100x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="approve",outcome="success",le="1.0"}'
        values: '0+50x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="approve",outcome="success",le="2.5"}'
        values: '0+60x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="approve",outcome="success",le="5.0"}'
        values: '0+100x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="approve",outcome="success",le="+Inf"}'
        values: '0+100x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="disburse",outcome="success",le="0.5"}'
        values: '0+100x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="disburse",outcome="success",le="1.0"}'
        values: '0+100x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="disburse",outcome="success",le="+Inf"}'
        values: '0+100x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="submit",outcome="success",le="1.0"}'
        values: '0+100x10 1000+50x5 1350+100x14'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="submit",outcome="success",le="2.5"}'
        values: '0+100x30'
      - series: 'fineract_loan_command_execution_seconds_bucket{application="fineract",command="submit",outcome="success",le="+Inf"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: FineractLoanCommandLatencyHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: FineractLoanCommandLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              command: repay
            exp_annotations:
              summary: "Loan repay commands are slow (p95 above 1 s)"
              description: >-
                The 95th percentile of successful loan repay commands on fineract is 1.75s over the last 5
                minutes (threshold 1 s). The value is interpolated inside an SLO bucket; what is exact is that
                more than 5% of commands took longer than 1 s.
          - exp_labels:
              severity: warning
              application: fineract
              command: approve
            exp_annotations:
              summary: "Loan approve commands are slow (p95 above 1 s)"
              description: >-
                The 95th percentile of successful loan approve commands on fineract is 4.688s over the last 5
                minutes (threshold 1 s). The value is interpolated inside an SLO bucket; what is exact is that
                more than 5% of commands took longer than 1 s.
      - eval_time: 25m
        alertname: FineractLoanCommandLatencyCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              application: fineract
              command: approve
            exp_annotations:
              summary: "Loan approve commands are very slow (p95 above 2.5 s)"
              description: >-
                The 95th percentile of successful loan approve commands on fineract is 4.688s over the last 5
                minutes (threshold 2.5 s). More than 5% of commands took longer than 2.5 s. Values above the
                last bucket are reported as 10 s.

  # Loan endpoint latency. Only /api/v1/loans routes with enough traffic alert.
  #   GET  /api/v1/loans/{loanId}:               100 a minute, p95 = 1.75 s, mean 0.6 s -> both alerts
  #   POST /api/v1/loans/{loanId}/transactions:  100 a minute, fast                    -> no alert
  #   GET  /api/v1/loans:                        1 a minute, slow                      -> no alert, too few requests
  #   GET  /api/v1/clients/{clientId}:           100 a minute, slow                    -> no alert, not a loan route
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="GET",uri="/api/v1/loans/{loanId}",status="200",outcome="SUCCESS",le="0.5"}'
        values: '0+80x30'
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="GET",uri="/api/v1/loans/{loanId}",status="200",outcome="SUCCESS",le="1.0"}'
        values: '0+90x30'
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="GET",uri="/api/v1/loans/{loanId}",status="200",outcome="SUCCESS",le="2.5"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="GET",uri="/api/v1/loans/{loanId}",status="200",outcome="SUCCESS",le="+Inf"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_count{application="fineract",method="GET",uri="/api/v1/loans/{loanId}",status="200",outcome="SUCCESS"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_sum{application="fineract",method="GET",uri="/api/v1/loans/{loanId}",status="200",outcome="SUCCESS"}'
        values: '0+60x30'
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="POST",uri="/api/v1/loans/{loanId}/transactions",status="200",outcome="SUCCESS",le="0.5"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="POST",uri="/api/v1/loans/{loanId}/transactions",status="200",outcome="SUCCESS",le="+Inf"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_count{application="fineract",method="POST",uri="/api/v1/loans/{loanId}/transactions",status="200",outcome="SUCCESS"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_sum{application="fineract",method="POST",uri="/api/v1/loans/{loanId}/transactions",status="200",outcome="SUCCESS"}'
        values: '0+6x30'
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="GET",uri="/api/v1/loans",status="200",outcome="SUCCESS",le="2.5"}'
        values: '0x30'
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="GET",uri="/api/v1/loans",status="200",outcome="SUCCESS",le="+Inf"}'
        values: '0+1x30'
      - series: 'http_server_requests_seconds_count{application="fineract",method="GET",uri="/api/v1/loans",status="200",outcome="SUCCESS"}'
        values: '0+1x30'
      - series: 'http_server_requests_seconds_sum{application="fineract",method="GET",uri="/api/v1/loans",status="200",outcome="SUCCESS"}'
        values: '0+4x30'
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="GET",uri="/api/v1/clients/{clientId}",status="200",outcome="SUCCESS",le="2.5"}'
        values: '0x30'
      - series: 'http_server_requests_seconds_bucket{application="fineract",method="GET",uri="/api/v1/clients/{clientId}",status="200",outcome="SUCCESS",le="+Inf"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_count{application="fineract",method="GET",uri="/api/v1/clients/{clientId}",status="200",outcome="SUCCESS"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_sum{application="fineract",method="GET",uri="/api/v1/clients/{clientId}",status="200",outcome="SUCCESS"}'
        values: '0+400x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: FineractLoanEndpointLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              method: GET
              uri: "/api/v1/loans/{loanId}"
            exp_annotations:
              summary: "GET /api/v1/loans/{loanId} is slow (p95 above 1 s)"
              description: >-
                The 95th percentile of GET /api/v1/loans/{loanId} on fineract is 1.75s over the last 5 minutes
                (threshold 1 s). This rule only has data when the http.server.requests histogram is enabled.
      - eval_time: 25m
        alertname: FineractLoanEndpointMeanLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              method: GET
              uri: "/api/v1/loans/{loanId}"
            exp_annotations:
              summary: "GET /api/v1/loans/{loanId} is slow (mean above 500 ms)"
              description: >-
                The mean response time of GET /api/v1/loans/{loanId} on fineract is 600ms over the last 5
                minutes (threshold 500 ms). This rule needs no histogram, so it also works with the default
                metrics configuration.

  # COB failures. 100 loans a minute.
  #   LOAN_DELINQUENCY_CLASSIFICATION fails for the first time at minute 20: its failure series is created
  #   with the value 1, which increase() cannot see. Two more loans fail at minute 24, so minute 30 reports 3.
  #   3 failures in 3,000 loans is below the 1% of the critical rule.
  - interval: 1m
    input_series:
      - series: 'up{job="fineract-server",instance="fineract:8443"}'
        values: '1x60'
      - series: 'fineract_cob_loans_processed_total{job="fineract-server",instance="fineract:8443",application="fineract",outcome="success"}'
        values: '0+100x60'
      - series: 'fineract_cob_loans_processed_total{job="fineract-server",instance="fineract:8443",application="fineract",outcome="failure"}'
        values: '0x19 1x3 3x37'
      - series: 'fineract_cob_step_execution_seconds_count{job="fineract-server",instance="fineract:8443",application="fineract",step="LOAN_DELINQUENCY_CLASSIFICATION",outcome="success"}'
        values: '0+100x60'
      - series: 'fineract_cob_step_execution_seconds_count{job="fineract-server",instance="fineract:8443",application="fineract",step="LOAN_DELINQUENCY_CLASSIFICATION",outcome="failure"}'
        values: '_x20 1x3 3x37'
    alert_rule_test:
      - eval_time: 19m
        alertname: FineractCobStepFailures
        exp_alerts: []
      - eval_time: 20m
        alertname: FineractCobStepFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              step: LOAN_DELINQUENCY_CLASSIFICATION
            exp_annotations:
              summary: "COB step LOAN_DELINQUENCY_CLASSIFICATION is failing"
              description: >-
                Failed executions of COB business step LOAN_DELINQUENCY_CLASSIFICATION on fineract in the last
                15 minutes: about 1. Each one ended one attempt at a loan's step chain. The batch job retries a
                loan, so one loan can count more than once. The server log has the loan id and the exception.
      - eval_time: 30m
        alertname: FineractCobStepFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              step: LOAN_DELINQUENCY_CLASSIFICATION
            exp_annotations:
              summary: "COB step LOAN_DELINQUENCY_CLASSIFICATION is failing"
              description: >-
                Failed executions of COB business step LOAN_DELINQUENCY_CLASSIFICATION on fineract in the last
                15 minutes: about 3. Each one ended one attempt at a loan's step chain. The batch job retries a
                loan, so one loan can count more than once. The server log has the loan id and the exception.
      # no new failure for more than 15 minutes
      - eval_time: 50m
        alertname: FineractCobStepFailures
        exp_alerts: []
      - eval_time: 20m
        alertname: FineractCobLoanFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
            exp_annotations:
              summary: "Loans are failing close of business"
              description: >-
                Failed attempts to take a loan through the COB step chain on fineract in the last 15 minutes:
                about 1. The batch job retries a loan, so one loan can count more than once. When it gives up
                on a loan it rolls back that loan's chunk, and every loan in the chunk keeps its old COB date
                until a later run processes it.
      - eval_time: 50m
        alertname: FineractCobLoanFailures
        exp_alerts: []
      - eval_time: 40m
        alertname: FineractCobLoanFailureRatioCritical
        exp_alerts: []

  # Prometheus starts with an empty database while the server already has 3 step failures from an hour ago.
  # Nothing failed since, so the loan failure counter does not move and nothing fires.
  - interval: 1m
    input_series:
      - series: 'up{job="fineract-server",instance="fineract:8443"}'
        values: '1x40'
      - series: 'fineract_cob_loans_processed_total{job="fineract-server",instance="fineract:8443",application="fineract",outcome="success"}'
        values: '5000+100x40'
      - series: 'fineract_cob_loans_processed_total{job="fineract-server",instance="fineract:8443",application="fineract",outcome="failure"}'
        values: '3x40'
      - series: 'fineract_cob_step_execution_seconds_count{job="fineract-server",instance="fineract:8443",application="fineract",step="LOAN_DELINQUENCY_CLASSIFICATION",outcome="failure"}'
        values: '3x40'
    alert_rule_test:
      - eval_time: 1m
        alertname: FineractCobStepFailures
        exp_alerts: []
      - eval_time: 14m
        alertname: FineractCobStepFailures
        exp_alerts: []
      - eval_time: 16m
        alertname: FineractCobStepFailures
        exp_alerts: []
      - eval_time: 30m
        alertname: FineractCobStepFailures
        exp_alerts: []
      - eval_time: 16m
        alertname: FineractCobLoanFailures
        exp_alerts: []

  # Prometheus has scraped the server for 4 minutes when the first batch job fails 6 step executions at once
  # (seen on a live server: one loan failed once, the next one five times through retries). The step series
  # is created at 6. The step alert fires without 15 minutes of history, and stops 15 minutes later.
  - interval: 1m
    input_series:
      - series: 'up{job="fineract-server",instance="fineract:8443"}'
        values: '1x40'
      - series: 'fineract_cob_loans_processed_total{job="fineract-server",instance="fineract:8443",application="fineract",outcome="success"}'
        values: '0 0 0 1000 1423x36'
      - series: 'fineract_cob_loans_processed_total{job="fineract-server",instance="fineract:8443",application="fineract",outcome="failure"}'
        values: '0 0 0 0 6x36'
      - series: 'fineract_cob_step_execution_seconds_count{job="fineract-server",instance="fineract:8443",application="fineract",step="LOAN_DELINQUENCY_CLASSIFICATION",outcome="failure"}'
        values: '_ _ _ _ 6x36'
    alert_rule_test:
      - eval_time: 3m
        alertname: FineractCobStepFailures
        exp_alerts: []
      - eval_time: 5m
        alertname: FineractCobStepFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              step: LOAN_DELINQUENCY_CLASSIFICATION
            exp_annotations:
              summary: "COB step LOAN_DELINQUENCY_CLASSIFICATION is failing"
              description: >-
                Failed executions of COB business step LOAN_DELINQUENCY_CLASSIFICATION on fineract in the last
                15 minutes: about 6. Each one ended one attempt at a loan's step chain. The batch job retries a
                loan, so one loan can count more than once. The server log has the loan id and the exception.
      - eval_time: 25m
        alertname: FineractCobStepFailures
        exp_alerts: []

  # COB failure ratio and step latency. 5% of loans fail; one step has p95 = 0.81 s, the other is fast.
  - interval: 1m
    input_series:
      - series: 'fineract_cob_loans_processed_total{application="fineract",outcome="success"}'
        values: '0+95x30'
      - series: 'fineract_cob_loans_processed_total{application="fineract",outcome="failure"}'
        values: '0+5x30'
      - series: 'fineract_cob_step_execution_seconds_bucket{application="fineract",step="ADD_PERIODIC_ACCRUAL_ENTRIES",outcome="success",le="0.1"}'
        values: '0+50x30'
      - series: 'fineract_cob_step_execution_seconds_bucket{application="fineract",step="ADD_PERIODIC_ACCRUAL_ENTRIES",outcome="success",le="0.25"}'
        values: '0+80x30'
      - series: 'fineract_cob_step_execution_seconds_bucket{application="fineract",step="ADD_PERIODIC_ACCRUAL_ENTRIES",outcome="success",le="1.0"}'
        values: '0+100x30'
      - series: 'fineract_cob_step_execution_seconds_bucket{application="fineract",step="ADD_PERIODIC_ACCRUAL_ENTRIES",outcome="success",le="+Inf"}'
        values: '0+100x30'
      - series: 'fineract_cob_step_execution_seconds_bucket{application="fineract",step="CHECK_LOAN_REPAYMENT_DUE",outcome="success",le="0.005"}'
        values: '0+100x30'
      - series: 'fineract_cob_step_execution_seconds_bucket{application="fineract",step="CHECK_LOAN_REPAYMENT_DUE",outcome="success",le="+Inf"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: FineractCobLoanFailureRatioCritical
        exp_alerts: []
      - eval_time: 10m
        alertname: FineractCobLoanFailureRatioCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              application: fineract
            exp_annotations:
              summary: "More than 1% of loans fail close of business"
              description: >-
                5% of the loans processed by COB on fineract in the last 30 minutes failed (threshold 1%). That
                is a broken step or broken data across many loans, not one bad loan. See the alert
                FineractCobStepFailures for the step.
      - eval_time: 20m
        alertname: FineractCobStepLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              application: fineract
              step: ADD_PERIODIC_ACCRUAL_ENTRIES
            exp_annotations:
              summary: "COB step ADD_PERIODIC_ACCRUAL_ENTRIES is slow (p95 above 250 ms)"
              description: >-
                The 95th percentile of COB business step ADD_PERIODIC_ACCRUAL_ENTRIES on fineract is 812.5ms for
                each loan over the last 5 minutes (threshold 250 ms). At that speed one partition thread handles
                at most 4 loans per second, and the nightly run may not finish in time.

  # COB stall. One sample every 5 minutes.
  #   fineract:     processes loans during the first hour, then nothing    -> fires 25 hours after the last loan
  #   fineract-new: first scraped at hour 24, has not processed a loan yet -> quiet, it is younger than the window
  #   fineract-ok:  processes loans every hour                             -> quiet
  - interval: 5m
    input_series:
      - series: 'fineract_cob_loans_processed_total{application="fineract",outcome="success"}'
        values: '0+100x12 1200x400'
      - series: 'fineract_cob_loans_processed_total{application="fineract",outcome="failure"}'
        values: '0x412'
      - series: 'fineract_cob_loans_processed_total{application="fineract-new",outcome="success"}'
        values: '_x288 0x124'
      - series: 'fineract_cob_loans_processed_total{application="fineract-new",outcome="failure"}'
        values: '_x288 0x124'
      - series: 'fineract_cob_loans_processed_total{application="fineract-ok",outcome="success"}'
        values: '0+10x412'
      - series: 'fineract_cob_loans_processed_total{application="fineract-ok",outcome="failure"}'
        values: '0x412'
    alert_rule_test:
      - eval_time: 25h
        alertname: FineractCobStalled
        exp_alerts: []
      - eval_time: 26h
        alertname: FineractCobStalled
        exp_alerts: []
      - eval_time: 27h
        alertname: FineractCobStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              application: fineract
            exp_annotations:
              summary: "No loan has gone through close of business for 25 hours"
              description: >-
                fineract_cob_loans_processed_total on fineract has not moved for 25 hours. The default schedule
                of the Loan COB job is once a day, so the job did not run, is stuck before its first loan, or
                had no loans to process. Check the job history (GET /v1/jobs) and the batch manager and worker
                logs.
